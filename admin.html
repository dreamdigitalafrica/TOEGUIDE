<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>T.O.E Guide Admin</title>
	<link rel="icon" href="assets/img/toe/toe-mark.png" type="image/png">
	<style>
		:root { --green: #061b14; --panel: #0d2a1f; --line: rgba(247,242,232,.16); --cream: #f7f2e8; --orange: #ff7138; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; color: var(--cream); background: radial-gradient(circle at 20% 0%, #1b4a34, var(--green) 45%, #020b08); }
		a { color: inherit; }
		.toe-admin-header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 24px clamp(18px, 4vw, 56px); border-bottom: 1px solid var(--line); }
		.toe-admin-brand { display: flex; align-items: center; gap: 14px; }
		.toe-admin-brand img { width: 52px; height: 52px; object-fit: contain; }
		.toe-admin-brand h1 { margin: 0; font-size: clamp(26px, 4vw, 48px); line-height: 1; }
		.toe-admin-login { display: flex; gap: 10px; width: min(520px, 100%); }
		input, textarea, button { font: inherit; }
		input, textarea { width: 100%; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; color: var(--cream); background: rgba(255,255,255,.07); outline: none; }
		textarea { min-height: 120px; resize: vertical; }
		button { border: 0; border-radius: 999px; padding: 14px 22px; color: #07130f; background: var(--orange); font-weight: 800; cursor: pointer; transition: transform .25s ease, filter .25s ease; }
		button:hover { transform: translateY(-2px); filter: brightness(1.08); }
		.toe-admin-shell { padding: 34px clamp(18px, 4vw, 56px) 60px; }
		.toe-admin-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
		.toe-admin-tabs button { color: var(--cream); background: rgba(255,255,255,.08); border: 1px solid var(--line); text-transform: capitalize; }
		.toe-admin-tabs button.active { color: #07130f; background: var(--orange); }
		.toe-admin-grid { display: grid; grid-template-columns: minmax(260px, .85fr) minmax(320px, 1.15fr); gap: 24px; }
		.toe-admin-list, .toe-admin-editor { border: 1px solid var(--line); border-radius: 24px; background: rgba(7,26,19,.74); box-shadow: 0 24px 80px rgba(0,0,0,.26); padding: 18px; }
		.toe-admin-row { display: block; width: 100%; border-radius: 18px; margin-bottom: 12px; text-align: left; color: var(--cream); background: rgba(255,255,255,.05); border: 1px solid var(--line); }
		.toe-admin-row strong, .toe-admin-row span { display: block; }
		.toe-admin-row span { margin-top: 7px; color: rgba(247,242,232,.68); font-size: 13px; }
		.toe-admin-editor { display: grid; gap: 14px; }
		.toe-admin-editor label { display: grid; gap: 7px; color: rgba(247,242,232,.78); font-weight: 700; }
		.toe-admin-check { grid-template-columns: auto 1fr; align-items: center; }
		.toe-admin-check input { width: auto; }
		.toe-admin-actions { display: flex; gap: 10px; flex-wrap: wrap; }
		@media (max-width: 860px) { .toe-admin-header, .toe-admin-login { align-items: stretch; flex-direction: column; } .toe-admin-grid { grid-template-columns: 1fr; } }
	</style>
</head>
<body>
	<header class="toe-admin-header">
		<div class="toe-admin-brand">
			<a href="index.html" aria-label="Back to T.O.E Guide home"><img src="assets/img/toe/toe-mark.png" alt="T.O.E Guide"></a>
			<h1>T.O.E Admin</h1>
		</div>
		<form class="toe-admin-login" data-login>
			<input data-token type="password" placeholder="Admin access key" autocomplete="current-password">
			<button type="submit">Open</button>
		</form>
	</header>
	<main class="toe-admin-shell">
		<div class="toe-admin-tabs" data-admin-tabs></div>
		<div class="toe-admin-grid">
			<section class="toe-admin-list" data-admin-list>
				<p>Enter the admin access key to load T.O.E records.</p>
			</section>
			<form class="toe-admin-editor" data-admin-editor></form>
		</div>
	</main>
	<script src="assets/js/toe-admin.js"></script>
</body>
</html>
